<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Page</title>
<script src="script.js" defer></script>

<!--START OF INTERNAL CSS-->
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    background-color: #F4F4F4; /* Soft Warm Gray */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-image: url('background-image.jpg'); /* Replace with your image path */
    background-size: cover;
    background-position: center;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(244, 244, 244, 0.7); /* Reduced opacity for background image */
    z-index: -1;
  }

  .container {
    display: flex;
    width: 800px;
    background-color: white;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    overflow: hidden
  
  }

  .button-link {
    display: inline-block; /* Or block, depending on your layout */
    padding: 10px 20px;
    background-color: #C4A76F; /* Example button color */
    color: white;
    text-decoration: none;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  
  .button-link:hover {
    background-color: #6B7280; /* Slightly darker on hover */
  }

  .left-section {
    width: 40%;
    background-color: #7A6C5D; 
    color: white;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .left-section h1 {
    font-size: 2em;
    margin-bottom: 20px;
  }

  .left-section p {
    font-size: 1em;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .left-section a {
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 10px 20px;
    border-radius: 5px;
  }
  .go-back-home {
    text-align:end;
    margin-top: 150px; /* Spacing after the form */
}

.go-back-home a {
    display: inline-block;
    text-decoration: none;
    background-color: #C4A76F; /* Match your theme color */
    color: white;
    padding: 8px 15px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.3s ease;
}

.go-back-home a:hover {
    background-color: #7A6C5D; /* Darker shade on hover */
}
  .right-section {
    width: 60%;
    padding: 40px;
  }

  .right-section h2 {
    font-size: 2em;
    margin-bottom: 30px;
    color: #2D2D2D; /* Charcoal */
  }

  .right-section input[type="text"],
  .right-section input[type="email"],
  .right-section input[type="password"] {
    width: calc(100% - 22px);
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #D1D5DB; /* Light Gray */
    border-radius: 5px;
    font-size: 1em;
    color: #333333; /* Dark Gray */
  }

  .right-section button {
    width: 100%;
    padding: 12px;
    background-color: #7A6C5D;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 1em;
    cursor: pointer;
  }

  .right-section button:hover {
    background-color: #C4A76F; /* Slightly darker on hover */
  }

  .right-section .social-signup {
    margin-top: 30px;
    text-align: center;
  }

  .right-section .social-signup a {
    display: inline-block;
    margin: 0 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #6B7280; /* Cool Gray */
    text-decoration: none;
    line-height: 40px;
    text-align: center;
    color: white;
  }

</style>
<!--END OF INTERNAL CSS-->
</head>

<body>
  <div class="container">
    <div class="left-section">
      <h1>Join us!</h1>
      <p>Get instant access to new journals, follow your favourites and recieve instant updates.</p>
      <p>Already have an account?</p>
      <a href="login.html" class="button-link">Sign In</a>
      <div class="go-back-home">
        <a href="index.html">⬅ Go back to Home</a>
      </div>
    </div>
    <!-- ===== Sign Up Form ===== -->
    <div class="right-section">

      <h2>Sign Up</h2>
      <p>Username: </p>
      <input type="text" placeholder="Jackson_Hall">

      <!-- Email Input -->
      <p>Email: </p>
      <input type="email" placeholder="jackson123@gmail.com">

      <!-- Password Input -->
      <p>Password: </p>
      <input type="password" placeholder="********">

      <p>Confirm password: </p>
      <input type="password" placeholder="********">

      <!-- Sign up Button -->
      <button>Sign Up</button>

      <div class="social-signup">
        <p>or sign up with</p>
        <a href="#">G+</a>
        <a href="#">f</a>
        <a href="#">in</a>
      </div>


    </div>

  </div>
  
</body>
</html>
